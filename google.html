<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in with Google...</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --main-brown: #8b5e3c;
            --dark-brown: #5d4037;
            --light-beige: #f4f1ee;
        }

        body {
            background-color: var(--light-beige);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(101, 67, 33, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .google-logo {
            font-size: 2.5rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        .spinner-container {
            margin: 20px 0;
        }

        .spinner-border {
            color: var(--main-brown);
            width: 2.5rem;
            height: 2.5rem;
        }

        .status-msg {
            color: var(--dark-brown);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .user-hint {
            color: #888;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="google-logo">
            <i class="bi bi-google" style="color: #8b5e3c;"></i>
        </div>

        <div class="spinner-container">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="status-msg" id="statusText">Connecting to Google...</div>
        <div class="user-hint">Please wait while we sync your UniBook account.</div>
    </div>

    <script>
        const status = document.getElementById('statusText');

        setTimeout(() => {
            status.innerText = "Verifying Credentials...";
            setTimeout(() => {
                status.innerText = "Redirecting to Hub...";
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);
            }, 1500);
        }, 1200);
    </script>
</body>

</html>
