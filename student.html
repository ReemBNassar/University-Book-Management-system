<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBook - لوحة الطالب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --main-brown: #8b5e3c; --dark-brown: #643526; --light-beige: #f4f1ee; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-beige); }
        .navbar-custom { background: var(--main-brown); }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link, .navbar-custom .btn { color: #fff !important; }
        .btn-brown { background: var(--main-brown); color: #fff; border: none; }
        .btn-brown:hover { background: var(--dark-brown); color: #fff; }
        .book-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(101,67,33,.08); transition: transform .2s; height: 100%; }
        .book-card:hover { transform: translateY(-4px); }
        .badge-available { background: #2e7d32; }
        .badge-borrowed { background: #c62828; }
        .badge-damaged { background: #757575; }
        .section-title { color: var(--dark-brown); font-weight: 700; }
        .notif-dot { position: absolute; top: 4px; left: 6px; width: 9px; height: 9px; background: red; border-radius: 50%; }
        .tab-btn.active { background: var(--main-brown); color: #fff; }
        .tab-btn { border: 1px solid var(--main-brown); color: var(--main-brown); background: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="bi bi-book-half"></i> UniBook</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">مرحبًا، <span id="userName">...</span></span>
            <button class="btn position-relative" onclick="showTab('notifications')">
                <i class="bi bi-bell-fill fs-5"></i>
                <span class="notif-dot" id="notifDot" style="display:none"></span>
            </button>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">خروج</button>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- أزرار التبويبات -->
    <div class="d-flex gap-2 mb-4 flex-wrap">
        <button class="btn tab-btn active" data-tab="browse" onclick="showTab('browse')"><i class="bi bi-search"></i> تصفح الكتب</button>
        <button class="btn tab-btn" data-tab="requests" onclick="showTab('requests')"><i class="bi bi-list-check"></i> طلباتي</button>
        <button class="btn tab-btn" data-tab="history" onclick="showTab('history')"><i class="bi bi-clock-history"></i> السجل</button>
        <button class="btn tab-btn" data-tab="notifications" onclick="showTab('notifications')"><i class="bi bi-bell"></i> الإشعارات</button>
    </div>

    <!-- تصفح الكتب -->
    <div id="tab-browse">
        <h4 class="section-title mb-3">تصفح الكتب</h4>
        <div class="row g-2 mb-4">
            <div class="col-md-6"><input type="text" id="searchInput" class="form-control" placeholder="ابحث بالعنوان أو المؤلف..." oninput="loadBooks()"></div>
            <div class="col-md-4">
                <select id="deptFilter" class="form-select" onchange="loadBooks()">
                    <option value="">كل الأقسام</option>
                    <option>Computer Engineering</option>
                    <option>Electrical Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                    <option>General</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="statusFilter" class="form-select" onchange="loadBooks()">
                    <option value="">كل الحالات</option>
                    <option value="Available">متاح</option>
                    <option value="Borrowed">مُعار</option>
                </select>
            </div>
        </div>
        <div class="row g-3" id="booksGrid"></div>
        <p class="text-muted text-center mt-4" id="noBooks" style="display:none">لا توجد كتب مطابقة.</p>
    </div>

    <!-- طلباتي -->
    <div id="tab-requests" style="display:none">
        <h4 class="section-title mb-3">طلباتي</h4>
        <div id="requestsList"></div>
    </div>

    <!-- السجل -->
    <div id="tab-history" style="display:none">
        <h4 class="section-title mb-3">سجل الاستعارة</h4>
        <div id="historyList"></div>
    </div>

    <!-- الإشعارات -->
    <div id="tab-notifications" style="display:none">
        <h4 class="section-title mb-3">الإشعارات</h4>
        <div id="notifList"></div>
    </div>

</div>

<script src="api/api.js"></script>
<script>
    const statusMap = { Available: ['متاح','badge-available'], Borrowed: ['مُعار','badge-borrowed'], Damaged: ['تالف','badge-damaged'] };

    // التأكد من الجلسة
    async function init() {
        const me = await apiGet('me.php');
        if (!me.success) { window.location.href = 'login.html'; return; }
        if (me.user.role !== 'Student') { window.location.href = 'admin_dashboard.html'; return; }
        document.getElementById('userName').innerText = me.user.full_name;
        loadBooks();
        loadNotifications();
    }

    function showTab(tab) {
        ['browse','requests','history','notifications'].forEach(t => {
            document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none';
        });
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'requests') loadRequests();
        if (tab === 'history') loadHistory();
        if (tab === 'notifications') loadNotifications();
    }

    // ===== الكتب =====
    async function loadBooks() {
        const q = document.getElementById('searchInput').value;
        const dept = document.getElementById('deptFilter').value;
        const status = document.getElementById('statusFilter').value;
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (dept) params.set('department', dept);
        if (status) params.set('status', status);
        const res = await apiGet('books.php?' + params.toString());
        const grid = document.getElementById('booksGrid');
        grid.innerHTML = '';
        document.getElementById('noBooks').style.display = (res.books && res.books.length) ? 'none' : 'block';
        (res.books || []).forEach(b => {
            const [label, cls] = statusMap[b.status] || [b.status, ''];
            const canBorrow = b.status === 'Available';
            grid.innerHTML += `
                <div class="col-md-4 col-lg-3">
                    <div class="book-card p-3 d-flex flex-column">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge ${cls}">${label}</span>
                            <small class="text-muted">${b.department || ''}</small>
                        </div>
                        <h6 class="fw-bold">${escapeHtml(b.title)}</h6>
                        <p class="text-muted small mb-3">${escapeHtml(b.author)}</p>
                        <button class="btn btn-brown btn-sm mt-auto" onclick="borrow(${b.book_id})">
                            ${canBorrow ? 'طلب استعارة' : 'انضم لقائمة الانتظار'}
                        </button>
                    </div>
                </div>`;
        });
    }

    async function borrow(bookId) {
        const res = await apiPost('borrow_request.php', { book_id: bookId });
        alert(res.message);
        if (res.success) loadBooks();
    }

    // ===== الطلبات =====
    async function loadRequests() {
        const res = await apiGet('my_requests.php');
        const box = document.getElementById('requestsList');
        if (!res.requests || !res.requests.length) { box.innerHTML = '<p class="text-muted">لا توجد طلبات.</p>'; return; }
        const stMap = { Pending:'قيد المراجعة', Approved:'تمت الموافقة', Rejected:'مرفوض', Returned:'تم الإرجاع' };
        box.innerHTML = res.requests.map(r => `
            <div class="book-card p-3 mb-2 d-flex justify-content-between align-items-center">
                <div>
                    <strong>${escapeHtml(r.title)}</strong> <span class="text-muted small">— ${escapeHtml(r.author)}</span><br>
                    <span class="small">الحالة: ${stMap[r.status] || r.status}</span>
                    ${r.return_deadline ? `<span class="small text-muted"> | موعد الإرجاع: ${r.return_deadline}</span>` : ''}
                </div>
                ${r.status === 'Pending' ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelReq(${r.request_id})">إلغاء</button>` : ''}
            </div>`).join('');
    }

    async function cancelReq(id) {
        if (!confirm('إلغاء الطلب؟')) return;
        const res = await apiPost('request_cancel.php', { request_id: id });
        alert(res.message);
        loadRequests();
    }

    // ===== السجل =====
    async function loadHistory() {
        const res = await apiGet('my_history.php');
        const box = document.getElementById('historyList');
        if (!res.history || !res.history.length) { box.innerHTML = '<p class="text-muted">لا يوجد سجل بعد.</p>'; return; }
        box.innerHTML = res.history.map(h => `
            <div class="book-card p-3 mb-2">
                <strong>${escapeHtml(h.title || 'كتاب محذوف')}</strong>
                <span class="badge bg-secondary">${h.action_type}</span><br>
                <small class="text-muted">${new Date(h.action_date).toLocaleString('ar-EG')} — ${escapeHtml(h.note || '')}</small>
            </div>`).join('');
    }

    // ===== الإشعارات =====
    async function loadNotifications() {
        const res = await apiGet('notifications.php');
        document.getElementById('notifDot').style.display = (res.unread > 0) ? 'block' : 'none';
        const box = document.getElementById('notifList');
        if (box) {
            if (!res.notifications || !res.notifications.length) { box.innerHTML = '<p class="text-muted">لا توجد إشعارات.</p>'; return; }
            box.innerHTML = res.notifications.map(n => `
                <div class="book-card p-3 mb-2 ${n.is_read ? '' : 'border-start border-4 border-warning'}">
                    <div>${escapeHtml(n.message)}</div>
                    <small class="text-muted">${new Date(n.sent_at).toLocaleString('ar-EG')}</small>
                    ${n.is_read ? '' : `<button class="btn btn-sm btn-link" onclick="markRead(${n.notification_id})">تعليم كمقروء</button>`}
                </div>`).join('');
        }
    }

    async function markRead(id) {
        await apiPost('notifications.php', { notification_id: id });
        loadNotifications();
    }

    async function logout() {
        await apiPost('logout.php', {});
        window.location.href = 'login.html';
    }

    function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    init();
</script>
</body>
</html>
